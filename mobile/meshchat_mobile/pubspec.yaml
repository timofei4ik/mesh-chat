name: meshchat_mobile
description: "MeshChat mobile client."
publish_to: "none"
version: 1.0.95+198

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  cryptography: ^2.7.0
  file_picker: ^10.3.7
  image_picker: ^1.2.1
  image: ^4.9.1
  pdf: ^3.13.0
  flutter_secure_storage: ^10.3.1
  shared_preferences: ^2.5.3
  uuid: ^4.5.1
  web: ^1.1.1
  web_socket_channel: ^3.0.3
  flutter_local_notifications: ^22.0.1
  firebase_core: ^4.4.0
  firebase_crashlytics: ^5.0.7
  firebase_performance: ^0.11.2+1
  sqflite: ^2.4.3
  sqflite_common_ffi: ^2.4.2
  path: ^1.9.1
  audioplayers: ^6.8.0
  path_provider: ^2.1.6
  package_info_plus: ^9.0.1
  record: ^7.1.0
  cross_file: ^0.3.5+2
  open_filex: ^4.7.0
  url_launcher: ^6.3.2
  dart_webrtc: ^1.8.1
  flutter_webrtc: ^1.5.2
  bluetooth_low_energy: ^6.2.1
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.1.3
  geolocator: ^14.0.2
  flutter_map: ^8.3.1
  latlong2: ^0.10.1
  video_player: ^2.10.1
  speech_to_text: ^7.4.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: NotoSansLinearB
      fonts:
        - asset: assets/fonts/NotoSansLinearB-Regular.ttf
  assets:
    - assets/app_icon.png
    - assets/meshpro_badge.png
    - assets/moose_reaction.png
    - assets/profile_collections/campfire_trails/cloud_camp_banner.webp
    - assets/profile_collections/campfire_trails/cloud_camp_banner_static.webp
    - assets/profile_collections/campfire_trails/cloud_camp_frame.png
    - assets/profile_collections/campfire_trails/cloud_camp_frame.webp
    - assets/profile_collections/campfire_trails/moon_trail_banner.webp
    - assets/profile_collections/campfire_trails/moon_trail_banner_static.webp
    - assets/profile_collections/campfire_trails/moon_trail_frame.png
    - assets/profile_collections/campfire_trails/moon_trail_frame.webp
    - assets/profile_collections/campfire_trails/ember_night_banner.webp
    - assets/profile_collections/campfire_trails/ember_night_banner_static.webp
    - assets/profile_collections/campfire_trails/ember_night_frame.png
    - assets/profile_collections/campfire_trails/ember_night_frame.webp
    - assets/profile_collections/campfire_trails/story_lanterns_banner.webp
    - assets/profile_collections/campfire_trails/story_lanterns_banner_static.webp
    - assets/profile_collections/campfire_trails/story_lanterns_frame.png
    - assets/profile_collections/campfire_trails/story_lanterns_frame.webp
    - assets/profile_collections/campfire_trails/rainlight_banner.webp
    - assets/profile_collections/campfire_trails/rainlight_banner_static.webp
    - assets/profile_collections/campfire_trails/rainlight_frame.png
    - assets/profile_collections/campfire_trails/rainlight_frame.webp
