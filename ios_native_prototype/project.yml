name: MeshChatNative
options:
  deploymentTarget:
    iOS: "12.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: 5.0
    DEVELOPMENT_TEAM: ""
targets:
  MeshChatNative:
    type: application
    platform: iOS
    deploymentTarget: "12.0"
    sources:
      - path: MeshChatNative
        excludes:
          - Info.plist
    info:
      path: MeshChatNative/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.meshchat.nativeprototype
        PRODUCT_NAME: MeshChatNativeLab
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
    scheme:
      gatherCoverageData: false
