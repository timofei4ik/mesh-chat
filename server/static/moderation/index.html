<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>MeshChat Moderation</title>
  <link rel="stylesheet" href="/admin/moderation/styles.css">
</head>
<body>
  <main class="shell">
    <header>
      <div class="brand"><span class="mark">M</span><div><h1>MeshChat</h1><p>Moderation console</p></div></div>
      <button id="logout" class="quiet hidden" type="button">Выйти</button>
    </header>

    <section id="loginView" class="login panel">
      <h2>Вход администратора</h2>
      <p>Доступ к жалобам и журналу решений.</p>
      <form id="loginForm">
        <label for="password">Пароль</label>
        <input id="password" type="password" autocomplete="current-password" required>
        <button type="submit">Войти</button>
        <output id="loginError"></output>
      </form>
    </section>

    <section id="dashboard" class="hidden">
      <nav class="tabs" aria-label="Очереди">
        <button data-status="new" class="active">Новые</button>
        <button data-status="needs_review">Проверить</button>
        <button data-status="resolved">Решённые</button>
        <button data-status="all">Все</button>
      </nav>
      <div class="workspace">
        <aside class="queue panel"><div id="queue"></div></aside>
        <article id="detail" class="detail panel empty">Выберите жалобу</article>
      </div>
    </section>
  </main>
  <script src="/admin/moderation/app.js" defer></script>
</body>
</html>
